name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install media engine
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Tests
        run: swift test
      - name: Package application
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS
          path: dist/Orbit-macOS.zip
          retention-days: 7
